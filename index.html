<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>yt-download</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>yt-download</h1>
    <form id="form">
      <div class="slot">
        <input
          id="url"
          name="url"
          type="url"
          required
          autocomplete="off"
          spellcheck="false"
          placeholder="https://"
          aria-label="URL"
        />
        <button type="submit" id="run">実行</button>
      </div>
      <div class="formats" role="radiogroup" aria-label="形式">
        <label><input type="radio" name="format" value="mp4" checked />mp4</label>
        <label><input type="radio" name="format" value="mp3" />mp3</label>
      </div>
    </form>
    <div id="progress" hidden>
      <div class="track" aria-hidden="true"><div id="bar"></div></div>
    </div>
    <ol id="checkpoints" aria-live="polite"></ol>
    <p id="save-row" hidden>
      <a id="save" download>保存</a>
      <span id="save-name"></span>
    </p>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
